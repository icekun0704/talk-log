name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (type check + single-file bundle)
        run: npm run build

      - name: Verify standalone output
        run: |
          set -euo pipefail
          test -s index.html
          test -s line_chat_analyzer_web.html
          test -s dist/index.html
          cmp --silent index.html line_chat_analyzer_web.html
          grep -q '<div id="root"></div>' index.html
          if grep -qE '<script[^>]+src="/|href="/assets/' index.html; then
            echo "::error::index.html contains non-inlined assets"
            exit 1
          fi
          echo "single-file size: $(wc -c < index.html) bytes"

      - name: Ensure build artifacts are committed
        run: |
          if ! git diff --quiet -- index.html line_chat_analyzer_web.html; then
            echo "::error::ビルド成果物が最新ではありません。'npm run build' を実行し、index.html と line_chat_analyzer_web.html をコミットしてください。"
            git diff --stat -- index.html line_chat_analyzer_web.html
            exit 1
          fi

      - name: Upload standalone build
        uses: actions/upload-artifact@v4
        with:
          name: talk-log-single-file
          path: line_chat_analyzer_web.html
          retention-days: 14
